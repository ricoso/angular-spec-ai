<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marke wählen | Bootstrap-Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="_shared.css" rel="stylesheet">
</head>
<body>
  <div class="demo-banner">🧪 Demo &mdash; <a href="index.html">Übersicht</a></div>

  <div class="wizard-steps">
    <div class="container d-flex flex-wrap">
      <span class="wizard-step wizard-step--done"><span class="wizard-step__circle"><i class="bi bi-check"></i></span> Filiale</span>
      <span class="wizard-step wizard-step--active"><span class="wizard-step__circle">2</span> Marke</span>
      <span class="wizard-step"><span class="wizard-step__circle">3</span> Service</span>
      <span class="wizard-step"><span class="wizard-step__circle">4</span> Hinweise</span>
      <span class="wizard-step"><span class="wizard-step__circle">5</span> Termin</span>
      <span class="wizard-step"><span class="wizard-step__circle">6</span> Buchung</span>
    </div>
  </div>

  <main class="page-wrap">
    <div class="branch-banner">
      <span class="branch-banner__icon"><i class="bi bi-geo-alt-fill"></i></span>
      <div>
        <div class="branch-banner__title">Filiale</div>
        <div class="branch-banner__address">Volkswagen Zentrum Düsseldorf &mdash; Höherweg 85, 40231 Düsseldorf</div>
      </div>
    </div>

    <h1 class="page-title">Marke wählen</h1>
    <p class="page-subtitle">Welche Marke möchten Sie buchen?</p>

    <div class="row g-3">
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card card-pickable h-100 p-4 d-flex flex-column align-items-center justify-content-center service-card" style="min-height: 9em;">
          <span class="badge-selected"><i class="bi bi-check-lg"></i></span>
          <img src="../../src/assets/brands/volkswagen.png" class="brand-logo" alt="Volkswagen">
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card card-pickable h-100 p-4 d-flex flex-column align-items-center justify-content-center service-card" style="min-height: 9em;">
          <span class="badge-selected"><i class="bi bi-check-lg"></i></span>
          <img src="../../src/assets/brands/audi.png" class="brand-logo" alt="Audi">
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card card-pickable selected h-100 p-4 d-flex flex-column align-items-center justify-content-center service-card" style="min-height: 9em;">
          <span class="badge-selected"><i class="bi bi-check-lg"></i></span>
          <img src="../../src/assets/brands/skoda.png" class="brand-logo" alt="ŠKODA">
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card card-pickable h-100 p-4 d-flex flex-column align-items-center justify-content-center service-card" style="min-height: 9em;">
          <span class="badge-selected"><i class="bi bi-check-lg"></i></span>
          <img src="../../src/assets/brands/seat.png" class="brand-logo" alt="SEAT">
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card card-pickable h-100 p-4 d-flex flex-column align-items-center justify-content-center service-card" style="min-height: 9em;">
          <span class="badge-selected"><i class="bi bi-check-lg"></i></span>
          <img src="../../src/assets/brands/cupra.png" class="brand-logo" alt="CUPRA">
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card card-pickable h-100 p-4 d-flex flex-column align-items-center justify-content-center service-card" style="min-height: 9em;">
          <span class="badge-selected"><i class="bi bi-check-lg"></i></span>
          <img src="../../src/assets/brands/hyundai.png" class="brand-logo" alt="Hyundai">
        </div>
      </div>
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card card-pickable h-100 p-4 d-flex flex-column align-items-center justify-content-center service-card" style="min-height: 9em;">
          <span class="badge-selected"><i class="bi bi-check-lg"></i></span>
          <img src="../../src/assets/brands/vw_nutzfahrzeuge.png" class="brand-logo" alt="VW Nutzfahrzeuge">
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="01-location.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Zurück</a>
      <a href="03-services.html" class="btn btn-primary btn-lg">Weiter <i class="bi bi-arrow-right ms-1"></i></a>
    </div>
  </main>

  <button class="cart-fab" title="Auswahl"><i class="bi bi-bag"></i></button>
  <script>
    document.querySelectorAll('.card-pickable').forEach(c => {
      c.addEventListener('click', () => {
        document.querySelectorAll('.card-pickable').forEach(o => o.classList.remove('selected'));
        c.classList.add('selected');
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="_layout.js"></script>
</body>
</html>
