server:
  port: ${PORT:3000}

app:
  session:
    secret: ${SESSION_SECRET:default-dev-secret-must-be-32-chars!}
    ttl-minutes: ${SESSION_TTL_MINUTES:20}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
  frame-ancestors: ${APP_FRAME_ANCESTORS:'self' https://www.gottfried-schultz.de https://gottfried-schultz.de}

softnet:
  base-url: ${SOFTNET_BASE_URL:}
  auth-url: ${SOFTNET_AUTH_URL:}
  fingerprint-json: ${SOFTNET_FINGERPRINT_JSON:}
  fingerprint-path: ${SOFTNET_FINGERPRINT_PATH:}
  timeout: ${SOFTNET_TIMEOUT:10000}

setup:
  json: ${SETUP_JSON:}
  json-path: ${SETUP_JSON_PATH:config/setup.json}

features:
  radwechsel-enabled: ${RADWECHSEL_ENABLED:true}

# REQ-030: daily AI error report. The scheduler + LLM beans only activate when
# LLM_API_KEY AND LLM_MODEL are set (see ErrorReportingConfiguration
# @ConditionalOnExpression). Managed identity for Log Analytics needs no secret.
reporting:
  workspace-id: ${LOG_WORKSPACE_ID:f4bd94f3-490e-44e2-b5e3-f98bcc5aea38}
  cron: ${REPORT_CRON:0 0 3 * * *}
  zone: ${REPORT_ZONE:Europe/Berlin}
  admin:
    user: ${REPORT_ADMIN_USER:admin}
    password: ${REPORT_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.autohaus.backend: DEBUG
    org.springframework.boot.autoconfigure.security: OFF
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %X{traceId:-system}: %msg%n"

spring:
  jackson:
    default-property-inclusion: non_null
  devtools:
    restart:
      enabled: true
      additional-exclude: "static/**,dist/**"
  # Spring AI — OpenAI-compatible endpoint. Defaults keep the app booting even
  # without secrets; the reporting feature stays inactive until LLM_API_KEY +
  # LLM_MODEL are provided (ErrorReportingConfiguration toggle).
  ai:
    openai:
      api-key: ${LLM_API_KEY:not-configured}
      base-url: ${LLM_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}
