<article class="summary-row" aria-labelledby="tile-title-appointment">
  <span class="summary-row__icon" aria-hidden="true">
    <i class="bi bi-clock"></i>
  </span>
  <div>
    <p class="summary-row__label" id="tile-title-appointment">
      {{ bookingOverview.tiles.appointment.title | translate }}
    </p>
    <p class="summary-row__value">
      {{ appointment().displayDate }} &mdash; {{ appointment().displayTime | berlinTime: appointment().date }}
    </p>
  </div>
</article>
