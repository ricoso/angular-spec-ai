<div class="time-day">
  <h2 class="time-day__heading">{{ day().displayHeading }}</h2>

  <div
    class="time-slots-grid"
    role="radiogroup"
    [attr.aria-label]="booking.workshopCalendar.slotsAriaLabel | translate"
  >
    @for (slot of day().slots; track slot.id) {
      <button
        class="time-slot-btn"
        type="button"
        role="radio"
        [class.time-slot-btn--selected]="selectedSlotId() === slot.id"
        [attr.aria-checked]="selectedSlotId() === slot.id"
        [attr.aria-label]="slot.displayTime | berlinTime: day().date"
        [attr.aria-describedby]="slot.rentalCarIncluded ? 'calendar-slot-rental-' + slot.id : null"
        (click)="onSlotClick(slot)"
        (keydown)="onSlotKeydown($event, slot)"
      >
        {{ slot.displayTime | berlinTime: day().date }}
        @if (slot.rentalCarIncluded) {
          <span class="time-slot-btn__rental" [id]="'calendar-slot-rental-' + slot.id">
            <i class="bi bi-car-front" aria-hidden="true"></i>
            {{ booking.appointment.rentalCar.included | translate }}
          </span>
        }
      </button>
    }
  </div>
</div>
