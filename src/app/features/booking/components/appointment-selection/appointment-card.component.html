<div
  class="slot"
  [class.selected]="isSelected()"
  role="radio"
  [attr.aria-checked]="isSelected()"
  [attr.aria-label]="appointment().dayAbbreviation + ', ' + appointment().displayDate + ', ' + appointment().displayTime"
  tabindex="0"
  (click)="onSelect()"
  (keydown)="onKeydown($event)"
>
  {{ appointment().displayTime }}
</div>
