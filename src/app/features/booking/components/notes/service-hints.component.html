@if (visibleHints().length > 0) {
  <section
    class="service-hints"
    [attr.aria-label]="booking.notes.hintsTitle | translate"
  >
    <h5 class="service-hints__title mb-3">{{ booking.notes.hintsTitle | translate }}</h5>

    <div class="vstack gap-2">
      @for (hint of visibleHints(); track hint.key) {
        <div class="card service-hints__item" role="note">
          <div class="card-body d-flex gap-3">
            @if (hint.iconUrl) {
              <span class="service-hints__icon" aria-hidden="true">
                <img [src]="hint.iconUrl" [alt]="''" class="service-hints__svg-icon">
              </span>
            } @else {
              <i class="bi bi-tools text-primary fs-4" aria-hidden="true"></i>
            }
            <div class="service-hints__body">
              <strong class="service-hints__service-name">{{ hint.serviceName }}</strong>
              @if (hint.hint) {
                <p class="service-hints__text small text-muted mb-0">{{ hint.hint }}</p>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </section>
}
