<div class="notes-form card">
  <div class="card-body">
    <p class="switch-card__title mb-1">
      <i class="bi bi-chat-text me-2 text-primary" aria-hidden="true"></i>
      {{ booking.notes.sectionTitle | translate }}
    </p>
    <p class="switch-card__hint mb-2" id="notes-hint">
      {{ booking.notes.textareaHint | translate }}
    </p>
    <textarea
      [formControl]="noteControl"
      [placeholder]="booking.notes.textareaPlaceholder | translate"
      [maxlength]="maxLength"
      [attr.aria-label]="booking.notes.sectionTitle | translate"
      [attr.aria-describedby]="'notes-hint notes-counter'"
      rows="4"
      class="form-control notes-form__textarea"
    ></textarea>
    <div class="form-text d-flex justify-content-end">
      <span
        id="notes-counter"
        aria-live="polite"
        class="notes-form__counter"
      >
        {{ currentLength() }} / {{ maxLength }}
      </span>
    </div>
  </div>
</div>
