@if (priceInfo(); as info) {
  <aside
    class="rent-category-price"
    role="status"
    aria-live="polite"
    [attr.aria-label]="booking.notes.rentCategoryPrice.srLabel | translate"
  >
    <span class="icon-framed rent-category-price__icon" aria-hidden="true">
      <mat-icon>directions_car</mat-icon>
    </span>
    <p class="rent-category-price__text">
      <span class="rent-category-price__label">
        {{ booking.notes.rentCategoryPrice.label | translate }}:
      </span>
      <strong class="rent-category-price__name">{{ info.name }}</strong>
      <span class="rent-category-price__separator" aria-hidden="true">—</span>
      <strong class="rent-category-price__amount">{{ formattedPrice() }}</strong>
      <span class="rent-category-price__unit">{{ unitLabelKey() | translate }}</span>
    </p>
  </aside>
}
