<app-wizard-breadcrumb [steps]="wizardSteps" [activeIndex]="activeStepIndex" />

<main class="page-wrap notes">
  <h1 class="page-title notes__title">{{ booking.notes.pageTitle | translate }}</h1>
  <p class="page-subtitle notes__subtitle">{{ booking.notes.pageSubtitle | translate }}</p>

  <app-notes-extras-form
    [initialExtras]="initialExtras()"
    [rentCategories]="rentCategories()"
    [initialRentCategoryId]="initialRentCategoryId()"
    [initialRentalCarRequested]="initialRentalCarRequested()"
    [rentalCarOffered]="rentalCarOffered()"
    [rentalCarUnavailable]="rentalCarUnavailable()"
    (extrasChanged)="onExtrasChanged($event)"
    (rentCategoryChanged)="onRentCategoryChanged($event)"
    (rentalCarChanged)="onRentalCarChanged($event)"
  />

  <app-notes-form
    [initialNote]="initialNote()"
    (noteChanged)="onNoteChanged($event)"
  />

  @if (selectedServices().length > 0) {
    <app-service-hints
      [selectedServices]="selectedServices()"
      [operations]="operations()"
      [jobTypes]="jobTypes()"
    />
  }

  <nav class="wizard-nav notes__actions" [attr.aria-label]="booking.notes.sectionTitle | translate">
    <button
      type="button"
      class="btn btn-outline-secondary notes__back-button"
      [attr.aria-label]="booking.notes.backButton | translate"
      (click)="onBack()"
    >
      {{ booking.notes.backButton | translate }}
    </button>
    <button
      type="button"
      class="btn btn-primary notes__continue-button"
      [attr.aria-label]="booking.notes.continueButton | translate"
      (click)="onContinue()"
    >
      {{ booking.notes.continueButton | translate }}
    </button>
  </nav>
</main>
