<div class="row g-3 location-grid" role="radiogroup" [attr.aria-label]="booking.location.ariaGroupLabel | translate">
  @for (branch of enrichedBranches(); track branch.cardId) {
    <div class="col-12 col-md-6 col-lg-4 location-grid__item">
      <input
        type="radio"
        name="location"
        [id]="'location-' + branch.cardId"
        class="location-grid__radio"
        [value]="branch.cardId"
        [checked]="branch.branchId === selectedBranch()?.branchId && branch.groupIdOverride === selectedGroupIdOverride()"
        [attr.aria-label]="branch.displayName + ', ' + branch.formattedAddress"
        (change)="onSelect(branch)"
      />
      <label
        [for]="'location-' + branch.cardId"
        class="card card-pickable h-100 p-3 location-card"
        [class.selected]="branch.branchId === selectedBranch()?.branchId && branch.groupIdOverride === selectedGroupIdOverride()"
      >
        <span class="badge-selected" aria-hidden="true">
          <i class="bi bi-check-lg"></i>
        </span>
        @if (branch.cardKind === 'tireChange') {
          <span class="badge bg-warning text-dark mb-2 align-self-start">
            <i class="bi bi-tools me-1" aria-hidden="true"></i>Radwechsel+ (Boxenstopp)
          </span>
        } @else if (branch.cardKind === 'recall') {
          <span class="badge mb-2 align-self-start location-card__badge--recall">
            <i class="bi bi-megaphone-fill me-1" aria-hidden="true"></i>{{ booking.recall.badge | translate }}
          </span>
        }
        <h5 class="mb-1 location-card__name">{{ branch.name }}</h5>
        <p class="mb-2 location-card__address">
          <i class="bi bi-geo-alt me-1" aria-hidden="true"></i>{{ branch.formattedAddress }}
        </p>
        <span class="d-flex gap-2 align-items-center mt-auto location-card__brands">
          @for (logo of branch.brandLogos; track logo.name) {
            <span
              [attr.aria-label]="logo.name"
              role="img"
              class="brand-logo brand-logo--sm location-card__brand-logo"
              [style.--brand-logo-url]="'url(' + logo.path + ')'"
            ></span>
          }
        </span>
      </label>
    </div>
  }
</div>
