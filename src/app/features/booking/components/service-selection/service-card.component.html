<!-- REQ-039: category pill as in mockups/wizard.css (.service-pills__item) — icon, name and a
     count badge (selected/total). The active pill shows the category in the panel below. -->
<button
  type="button"
  class="service-card service-pills__item"
  [class.service-pills__item--active]="isActive()"
  [class.service-card--selected]="isSelected()"
  [class.selected]="isSelected()"
  [attr.aria-pressed]="isActive()"
  (click)="onCardClick()">
  <i class="bi {{ iconClass() }} service-pills__icon" aria-hidden="true"></i>
  <span class="service-card-mini__title service-pills__name">{{ category().name }}</span>
  @if (hasOptions()) {
    <span
      class="service-card-mini__count service-pills__count"
      [class.service-pills__count--selected]="selectedCount() > 0">
      @if (selectedCount() > 0) {
        {{ selectedCount() }}/{{ operationCount() }}
      } @else {
        {{ operationCount() }}
      }
    </span>
  }
</button>
