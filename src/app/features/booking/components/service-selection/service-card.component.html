<div
  class="service-card service-card-mini"
  [class.service-card--selected]="isSelected()"
  [class.selected]="isSelected()"
  role="button"
  [attr.aria-pressed]="isSelected()"
  [attr.aria-expanded]="isExpanded()"
  tabindex="0"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (keydown.space)="onCardClick()">

  @if (hasOptions()) {
    <span class="service-card-mini__count">
      @if (selectedCount() > 0) {
        {{ selectedCount() }} / {{ operationCount() }}
      } @else {
        {{ operationCount() }}
      }
    </span>
  }

  <i class="bi {{ iconClass() }} service-card-mini__icon" aria-hidden="true"></i>
  <h6 class="service-card-mini__title">{{ category().name }}</h6>

  @if (isSelected()) {
    <span class="service-card__check" aria-hidden="true">
      <i class="bi bi-check-circle-fill"></i>
    </span>
  }
</div>
