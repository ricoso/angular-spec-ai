<header class="header" role="banner">
  <div class="header__content">
    <!-- Logo & Company Name -->
    <a routerLink="/" class="header__logo-link" aria-label="Zur Startseite">
      <div class="header__logo-container">
        <img
          src="logo.svg"
          [alt]="header.logo.alt | translate"
          class="header__logo"
          loading="lazy"
        />
      </div>
      <div class="header__company">
        <span class="header__company-name">{{ app.title | translate }}</span>
        <span class="header__company-subtitle">{{ app.subtitle | translate }}</span>
      </div>
    </a>

    <!-- Spacer -->
    <div class="header__spacer"></div>

    <!--
      Cart-Icon + Accessibility-Menu sind in <app-floating-overlay /> ausgelagert
      (FABs unten links/rechts). Hier nur noch der Close-Button im iframe-Modus.
    -->

    <!-- Close Button (only visible when embedded in iframe) -->
    @if (isEmbedded()) {
      <button
        type="button"
        class="btn btn-light header__close-button"
        [attr.aria-label]="header.close.buttonLabel | translate"
        (click)="onClose()">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    }
  </div>
</header>
