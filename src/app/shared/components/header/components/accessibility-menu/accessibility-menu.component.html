<div class="accessibility-menu">
  <!-- Language -->
  <section class="accessibility-menu__section">
    <h3 class="accessibility-menu__heading" id="language-label">
      {{ a11y.language.label | translate }}
    </h3>
    <div class="pill-group accessibility-menu__radio-group" role="radiogroup" aria-labelledby="language-label">
      @for (lang of languages; track lang.code) {
        <input
          type="radio"
          name="a11yLang"
          [id]="'a11y-lang-' + lang.code"
          [value]="lang.code"
          [checked]="currentLanguage() === lang.code"
          (change)="onLanguageChange(lang.code)" />
        <label
          class="accessibility-menu__radio"
          [for]="'a11y-lang-' + lang.code">
          {{ lang.label }}
        </label>
      }
    </div>
  </section>

  <!-- Font Size -->
  <section class="accessibility-menu__section">
    <h3 class="accessibility-menu__heading" id="font-size-label">
      {{ a11y.fontSize.label | translate }}
    </h3>
    <div class="pill-group accessibility-menu__radio-group" role="radiogroup" aria-labelledby="font-size-label">
      @for (size of fontSizes; track size) {
        <input
          type="radio"
          name="a11yFontSize"
          [id]="'a11y-font-' + size"
          [value]="size"
          [checked]="fontSize() === size"
          (change)="onFontSizeChange(size)" />
        <label
          class="accessibility-menu__radio"
          [for]="'a11y-font-' + size">
          @switch (size) {
            @case ('small')   { {{ a11y.fontSize.small | translate }} }
            @case ('normal')  { {{ a11y.fontSize.normal | translate }} }
            @case ('large')   { {{ a11y.fontSize.large | translate }} }
            @case ('x-large') { {{ a11y.fontSize.xLarge | translate }} }
          }
        </label>
      }
    </div>
  </section>

  <!-- High Contrast -->
  <section class="accessibility-menu__section">
    <div class="form-check form-switch accessibility-menu__toggle">
      <input
        #highContrastToggle
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="a11y-high-contrast"
        [checked]="highContrast()"
        (change)="onHighContrastChange(highContrastToggle.checked)" />
      <label class="form-check-label" for="a11y-high-contrast">
        {{ a11y.highContrast | translate }}
      </label>
    </div>
  </section>

  <!-- Reduced Motion -->
  <section class="accessibility-menu__section">
    <div class="form-check form-switch accessibility-menu__toggle">
      <input
        #reducedMotionToggle
        class="form-check-input"
        type="checkbox"
        role="switch"
        id="a11y-reduced-motion"
        [checked]="reducedMotion()"
        (change)="onReducedMotionChange(reducedMotionToggle.checked)" />
      <label class="form-check-label" for="a11y-reduced-motion">
        {{ a11y.reducedMotion | translate }}
      </label>
    </div>
  </section>
</div>
